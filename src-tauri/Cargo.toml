[package]
name = "kshell-updater"
version = "2.0.0"
description = "Keycard Shell Updater"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "kshell_updater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hidapi = { version = "2", features = ["linux-static-hidraw"] }

[lints.rust]
unsafe_code = "forbid"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keycard Shell Updater</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="ksh">
      <div class="ksh__head">
        <div>
          <h1 class="ksh__h1">Keycard Shell Updater</h1>
          <span class="ksh__hint" id="subtitle">Checking for a connected Shell…</span>
        </div>
        <span class="ksh__badge" id="badge">Scanning</span>
      </div>

      <section class="ksh__card" id="card-empty">
        <div class="ksh__empty">
          <img src="img/connect_shell.png" alt="Keycard Shell" />
          <h2 class="ksh__h2">Connect your Keycard Shell</h2>
          <span class="ksh__hint">USB-C. Accept the prompt on the Shell screen if it asks.</span>
        </div>
      </section>

      <section class="ksh__card" id="card-device" hidden>
        <div class="ksh__device">
          <img src="img/check.svg" alt="" />
          <div>
            <h2 class="ksh__h2" id="device-name">Keycard Shell</h2>
            <span class="ksh__hint" id="device-line">serial –</span>
          </div>
        </div>

        <div class="ksh__rows" id="rows"></div>

        <span class="ksh__hint" id="release-note">Reading the release list…</span>

        <div class="ksh__footer">
          <button class="ksh__btn ksh__btn--primary" id="btn-download" disabled>
            Download and verify
          </button>
        </div>
      </section>

      <div class="ksh__statusbar">
        <span id="status-device">No device connected</span>
        <span id="status-note">releases verified by sha256</span>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>

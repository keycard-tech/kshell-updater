name: installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # One job makes the release, so three machines never race to create the same one: github cannot
  # look a draft up by tag, and it lets two drafts carry the same tag, so the release has to be
  # settled and its id handed down before the matrix starts.
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.make.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      # `checks` says the three files agree with each other; this says the tag agrees with them too,
      # so a release is never named one thing while the files inside it are named another.
      - name: tag and version agree
        run: |
          version="$(python3 -c "import json;print(json.load(open('package.json'))['version'])")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "the tag is $GITHUB_REF_NAME but the app says $version"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is version $version"
      - name: draft release
        id: make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          # The list, not `releases/tags/{tag}`: that endpoint answers 404 for a draft, so looking
          # there would make every retry add another draft for the same tag.
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$tag\")) | .[0].id // empty")"
          if [ -z "$id" ]; then
            id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                   -f tag_name="$tag" -f name="$tag" -F draft=true --jq .id)"
            echo "created draft release $id"
          else
            echo "release $id already exists for $tag, adding to it"
          fi
          # An empty id here means all three build jobs fail later over a release name, which points
          # nowhere near the cause. Stop here instead.
          if [ -z "$id" ]; then echo "no release id came back for $tag"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }}
    needs: draft
    # A hand-started run has no tag, so its one dependency is skipped - and a skipped dependency
    # skips this job too unless it is let through.
    if: always() && needs.draft.result != 'failure' && needs.draft.result != 'cancelled'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,appimage
          # Universal, so the same file opens on an Apple silicon machine and an Intel one: the
          # updater is not in the app yet, and one download link should serve both.
          - os: macos-15
            args: --target universal-apple-darwin --bundles dmg
          - os: windows-latest
            args: --bundles msi,nsis
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libudev-dev patchelf

      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # The lockfile, not whatever `npm install` resolves today: the file a person downloads has to
      # match the tree that was reviewed.
      - run: npm ci

      # Once failed three times over a missing release name while the cause was an id that never
      # arrived from the job above. Both ends of that handoff in the log, so the next time it is
      # visible rather than inferred.
      - name: release target
        run: |
          echo "release id from the draft job: [${{ needs.draft.outputs.id }}]"

      - name: installers and release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple notarisation, once a certificate exists:
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with:
          includeRelease: true
          includeDebug: false
          # The id given when the release is already made: with it the action uploads and creates
          # nothing. It is empty on a hand-started run, which is what makes that run build without
          # touching a release at all.
          releaseId: ${{ needs.draft.outputs.id }}
          # Both of these are for the case where the id does not arrive: the action then looks the
          # release up by tag, which only works through the release list - and the list is what it
          # reads when it believes the release is a draft. Without `releaseName` that path gives up
          # with `"releaseName" not set`, which is the failure this replaces.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # Three artifacts, one per machine, so a run can be tried out, or its files attached to a
      # release made by hand, without pushing a tag first.
      - uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**

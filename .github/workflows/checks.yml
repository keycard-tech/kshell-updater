name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  types:
    name: types and leftovers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ui
      - run: python3 checks/dead-code.py
      - run: python3 checks/glyphs.py
      - name: one version
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, re, sys
          fromIni = lambda path, key: re.search(rf'^{key} = "(.*?)"', pathlib.Path(path).read_text(), re.M).group(1)
          versions = {
            'package.json': json.load(open('package.json'))['version'],
            'src-tauri/Cargo.toml': fromIni('src-tauri/Cargo.toml', 'version'),
            'src-tauri/tauri.conf.json': json.load(open('src-tauri/tauri.conf.json'))['version'],
          }
          if len(set(versions.values())) != 1:
            print('the version disagrees between files:', versions)
            sys.exit(1)
          print('one version:', *versions.values())
          PYTHON

  rust:
    name: rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libudev-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  layout:
    name: every state at 936x712
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1
      - run: npm ci
      - run: npm run ui
      - run: xvfb-run -a python3 checks/webkit-check.py
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: screens-where-it-went-wrong
          path: shots/wip/*.png
